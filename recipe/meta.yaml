{% set name = "cftime" %}
{% set version = "1.6.6" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 7b2716b3dce97ba1740189c424ce97bd6f8e65391b7fe323c6f0f817f6a8ad56
  patches:
    - patches/0001-changed-license-declaration-to-pep621-standard.patch  # [py>=313]

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --ignore-installed --no-cache-dir -vv
  skip: true  # [py<311]

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
  host:
    - python
    - pip
    - wheel
    - setuptools >=77.0.1  # [py<=312]
    # numpy 2.1 for py313 works only with setuptools<74
    - setuptools <74  # [py>=313]
    - cython >=0.29.20
    - numpy {{ numpy }}
  run:
    - python
    - numpy >=1.23.2

test:
  source_files:
    - test
  imports:
    - cftime
  commands:
    - pip check
    - pytest -vv test
  requires:
    - pip
    - pytest

about:
  home: https://github.com/Unidata/cftime
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Time-handling functionality from netcdf4-python
  description: |
    Time-handling functionality from netcdf4-python
  doc_url: https://github.com/Unidata/cftime
  dev_url: https://github.com/Unidata/cftime

extra:
  recipe-maintainers:
    - jhamman
    - ocefpaf
